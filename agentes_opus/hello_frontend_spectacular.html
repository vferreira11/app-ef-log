<!-- 🎨 PERSONA: frontend_dev -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Extraordinário</title>
    <style>
        /* 🎨 PERSONA: frontend_dev - Estilos para demonstração visual */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            perspective: 1000px;
        }

        .hello-world {
            font-size: 6rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite, rotate3d 12s linear infinite;
            margin-bottom: 2rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotateX(0deg); }
            50% { transform: translateY(-30px) rotateX(15deg); }
        }

        @keyframes rotate3d {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .subtitle {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.9);
            animation: pulse 2s ease-in-out infinite;
            margin-bottom: 3rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .persona-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: #4ecdc4;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: personaBadgeGlow 3s ease-in-out infinite;
        }

        @keyframes personaBadgeGlow {
            0%, 100% { box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(78, 205, 196, 0.6); }
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            max-width: 800px;
        }

        .feature-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .interactive-buttons {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            animation: particleFloat 6s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 🎨 PERSONA: frontend_dev - Interface principal -->
    <div class="persona-badge">
        🎨 Frontend Developer Active
    </div>

    <div class="particles" id="particles"></div>

    <div class="container">
        <h1 class="hello-world">Hello, World!</h1>
        <p class="subtitle">Frontend Spectacular Experience</p>
        
        <div class="features-grid">
            <div class="feature-card">
                <div class="feature-icon">🎨</div>
                <h3>Design System</h3>
                <p>Componentes modernos e responsivos</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <h3>Performance</h3>
                <p>Otimizado para velocidade</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📱</div>
                <h3>Mobile First</h3>
                <p>Design responsivo nativo</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">♿</div>
                <h3>Acessibilidade</h3>
                <p>WCAG 2.1 compliant</p>
            </div>
        </div>

        <div class="interactive-buttons">
            <button class="action-btn" onclick="showPersonaInfo()">Ver Persona Info</button>
            <button class="action-btn" onclick="toggleAnimation()">Toggle Animações</button>
            <button class="action-btn" onclick="changeTheme()">Mudar Tema</button>
        </div>
    </div>

    <script>
        // 🎨 PERSONA: frontend_dev - JavaScript interativo
        
        // Função para mostrar informações da persona
        function showPersonaInfo() {
            alert(`🎨 PERSONA ATIVA: Frontend Developer
            
            Responsável por:
            ✅ Interface de usuário moderna
            ✅ Experiência interativa
            ✅ Animações e transições
            ✅ Responsividade
            ✅ Acessibilidade
            
            Tecnologias: HTML5, CSS3, JavaScript, Design Systems`);
        }

        // Criar partículas flutuantes
        function createParticles() {
            const particleContainer = document.getElementById('particles');
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particleContainer.appendChild(particle);
            }
        }

        // Alternar animações
        let animationsEnabled = true;
        function toggleAnimation() {
            animationsEnabled = !animationsEnabled;
            document.body.style.animationPlayState = animationsEnabled ? 'running' : 'paused';
            
            const allElements = document.querySelectorAll('*');
            allElements.forEach(el => {
                el.style.animationPlayState = animationsEnabled ? 'running' : 'paused';
            });
        }

        // Mudar tema
        function changeTheme() {
            const colors = [
                '#ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57',
                '#667eea, #764ba2, #f093fb, #f5576c, #4facfe',
                '#43e97b, #38f9d7, #667eea, #764ba2, #f093fb',
                '#fa709a, #fee140, #667eea, #764ba2, #f093fb'
            ];
            
            const randomColors = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.background = `linear-gradient(45deg, ${randomColors})`;
        }

        // Console log com marcador de persona
        console.log('🎨 PERSONA: frontend_dev - Interface carregada com sucesso!');
        
        // Inicializar partículas
        createParticles();
        
        // Log de demonstração no console
        setTimeout(() => {
            console.log('%c🎨 FRONTEND DEVELOPER ATIVO', 
                'background: linear-gradient(45deg, #ff6b6b, #4ecdc4); color: white; padding: 10px; border-radius: 5px; font-weight: bold;');
            console.log('Interface totalmente carregada e interativa!');
        }, 1000);
    </script>
</body>
</html>
